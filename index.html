<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<title>Gym Tracker</title>
</head>
<body>
<header id="top">
  <button id="back" class="iconbtn ghost" aria-label="Back" hidden>‹</button>
  <div class="tt"><h1 id="title">Gym Tracker</h1><div id="subtitle"></div></div>
  <div id="hright"></div>
</header>
<div id="rest" hidden></div>
<main id="view"></main>
<div id="cta" hidden></div>
<nav id="tabs">
  <button data-tab="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
  <button data-tab="calendar"><svg viewBox="0 0 24 24"><path d="M7 2v3M17 2v3M3 9h18M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg>Calendar</button>
  <button data-tab="workouts"><svg viewBox="0 0 24 24"><path d="M2 12h20M5 7v10M8 5v14M16 5v14M19 7v10"/></svg>Workouts</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Progress</button>
  <button data-tab="profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</button>
</nav>
<div id="modal" hidden></div>
<div id="toast" hidden></div>
<noscript>This app needs JavaScript.</noscript>
<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
